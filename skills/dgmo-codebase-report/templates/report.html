<!DOCTYPE html>
<!--
  The codebase report's fixed template, filled by scripts/build-report.mjs.
  Each slot (a name in double braces) is replaced with HTML the script has
  already escaped; a slot with no value stops the build. The page
  follows the system theme with no script at all; the toggle is the only
  JavaScript, and the diagrams never need it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{title}}</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f3f5f8;
    --border: #d4dae1;
    --text: #1f2933;
    --text-muted: #5b6672;
    --primary: #3b6ea5;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161b22;
      --surface: #202833;
      --border: #38424f;
      --text: #e6eaef;
      --text-muted: #9aa5b1;
      --primary: #5b9bd5;
      color-scheme: dark;
    }
    :root:not([data-theme="light"]) .only-light { display: none; }
    :root:not([data-theme="light"]) .only-dark { display: block; }
  }
  :root[data-theme="dark"] {
    --bg: #161b22;
    --surface: #202833;
    --border: #38424f;
    --text: #e6eaef;
    --text-muted: #9aa5b1;
    --primary: #5b9bd5;
    color-scheme: dark;
  }
  .only-dark { display: none; }
  :root[data-theme="dark"] .only-light { display: none; }
  :root[data-theme="dark"] .only-dark { display: block; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  a { color: var(--primary); }
  .container { max-width: 1400px; margin: 0 auto; padding: 2rem 1.5rem; }
  h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
  h2 { font-size: 1.35rem; margin-top: 2.5rem; margin-bottom: 0.75rem; border-bottom: 1px solid var(--border); padding-bottom: 0.35rem; }
  .stamp { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
  .summary { max-width: 70ch; margin-bottom: 1.5rem; }
  .text { color: var(--text-muted); max-width: 70ch; margin-bottom: 0.75rem; }
  .toc { margin: 1.5rem 0; padding: 1rem 1.25rem; background: var(--surface); border-radius: 6px; }
  .toc h2 { font-size: 0.9rem; margin: 0 0 0.5rem; border: 0; padding: 0; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .toc ol { padding-left: 1.25rem; }
  .toc li { margin: 0.25rem 0; }
  .toc a { text-decoration: none; }
  .toc a:hover { text-decoration: underline; }
  .diagram { margin: 1rem 0; }
  .diagram img { max-width: 100%; height: auto; }
  .edit { font-size: 0.9rem; }
  .source summary { cursor: pointer; color: var(--text-muted); font-size: 0.9rem; }
  .source pre { margin-top: 0.5rem; padding: 0.75rem 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow-x: auto; font-size: 0.85rem; }
  .theme-toggle {
    position: fixed; top: 1rem; right: 1rem;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px;
    padding: 0.35rem 0.65rem; font-size: 0.8rem; cursor: pointer;
  }
  .theme-toggle:hover { border-color: var(--primary); color: var(--primary); }
  footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 0.9rem; text-align: center; }
  footer a { margin: 0 0.5rem; }
  @media print {
    .theme-toggle { display: none; }
    .diagram { break-inside: avoid; }
    h2 { break-after: avoid; }
  }
</style>
</head>
<body>
<button class="theme-toggle" type="button" hidden>Light / dark</button>
<div class="container">
<header>
<h1>{{title}}</h1>
<p class="stamp">{{stamp}}</p>
</header>
<p class="summary">{{summary}}</p>
{{toc}}
{{sections}}
<footer>
<p>Diagrams made with <a href="{{homeLink}}">Diagrammo</a> · <a href="{{appLink}}">Get the desktop app</a> · <a href="{{cloudLink}}">Sign up for Diagrammo Cloud</a></p>
</footer>
</div>
<script>
  (function () {
    var button = document.querySelector('.theme-toggle');
    var root = document.documentElement;
    button.hidden = false;
    button.addEventListener('click', function () {
      var current = root.dataset.theme
        || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      root.dataset.theme = current === 'dark' ? 'light' : 'dark';
    });
  })();
</script>
</body>
</html>
