name: CI

# Pull requests only, plus a manual run (diagrammo/diagrammo#1909, split from
# #1821). Every push to main has already passed .githooks/pre-push, which runs
# this job's frozen install, typecheck and test steps, so a push-triggered run
# repeated them and spent the org's free Actions minutes — the org budget
# hard-stops every workflow once those are gone.
#
# What only this workflow proves, kept here on purpose: a clean ubuntu machine
# with an empty store. A pull request is where that still earns its minutes:
# Dependabot's, and dependabot-automerge.yml, which already fires only on a CI
# run whose event is pull_request. To run it on main, start this workflow by
# hand (workflow_dispatch).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
