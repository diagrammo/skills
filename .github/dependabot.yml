# Keeps the commit-SHA pins in .github/workflows current
# (diagrammo/diagrammo#1798, one slice of #1779). Every `uses:` is pinned to a
# full 40-hex commit SHA with the release it is in as a trailing comment, so a
# retagged or hijacked action cannot run in CI. A pin never moves on its own,
# so this entry is what moves it: Dependabot opens a PR that bumps the SHA and
# the comment together. tests/workflow-pins.test.ts fails on any `uses:` that
# is not pinned this way.

version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
